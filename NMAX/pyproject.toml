[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "app.configs.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*/migrations/*", ".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "E402", "E731"]

[tool.coverage.run]
source = ["app"]
omit = ["*/migrations/*", "*/tests/*", "app/configs/*", "app/management/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
